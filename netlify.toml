[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist/spa"
  environment = { NODE_VERSION = "20.13.0" }

[dev]
  command = "npm run dev"
  port = 3000

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# SPA Routing - Redirige toutes les requêtes non trouvées vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
