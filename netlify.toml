[build]
  command = "npx tsc --project tsconfig.functions.json && npm run build"
  functions = "netlify/functions"
  publish = "dist/spa"
  environment = { NODE_VERSION = "20.13.0" }

[dev]
  command = "npm run dev"
  port = 3000

[functions]
  external_node_modules = ["twilio"]
  node_bundler = "esbuild"

# API Routes - Rewrite to Netlify Functions (no redirect, actual rewrite)
[[redirects]]
  from = "/api/send-donation-notification"
  to = "/.netlify/functions/send-donation-notification"
  status = 200
  force = true

[[redirects]]
  from = "/api/twilio-status"
  to = "/.netlify/functions/twilio-status"
  status = 200
  force = true

# SPA Routing - Redirige toutes les requêtes non trouvées vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
