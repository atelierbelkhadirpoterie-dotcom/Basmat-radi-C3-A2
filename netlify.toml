[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist/spa"
  environment = { NODE_VERSION = "20.13.0" }

[dev]
  command = "npm run dev"
  port = 3000

[functions]
  external_node_modules = ["twilio"]
  node_bundler = "esbuild"

# API Routes - Rewrite to unified API function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Routing - Redirige toutes les requêtes non trouvées vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
